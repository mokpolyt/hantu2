<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Critter Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--page:#e9efe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f1a12}}
:root[data-theme="dark"]{--page:#0f1a12}
html,body{height:100%;margin:0;background:var(--page)}
body{display:flex;align-items:center;justify-content:center}
.stage{height:min(100%,125vw);aspect-ratio:4/5;max-width:100%}
canvas{width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="800" height="1000"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=800,H=1000;
const EMO="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
const FONT="'Fredoka','Trebuchet MS',sans-serif";
const SP={frog:'🐸',fox:'🦊',croc:'🐊',owl:'🦉'};
const ACTS=['dance','box','fight','fish'];
const RULES=[ // attacker, prey, period, preySurvive
 {a:'fox',p:'frog',per:7,s:.34},
 {a:'croc',p:'fox',per:12,s:.25},
 {a:'owl',p:'croc',per:14,s:.49},
 {a:'frog',p:'owl',per:21,s:.23},
 {a:'croc',p:'owl',per:15,s:.30}];
RULES.forEach(r=>r.t=r.per);
const SCENES=['Desert','Arctic','Volcano'];
let ents=[],floats=[],events=[],parts=[],sceneIdx=0,prevScene=0,sceneT=0,fade=1,banner=3;
let lowT=0,heli=null,cometT=16,weapT=18,weapons=[],comets=[],stats={},throwT=200,toss=null,crack=null,shake=0;
const WEAPONS=[{n:'Shotgun',e:'🔫'},{n:'Uzi',e:'🔫'},{n:'Spear',e:'🔱'},{n:'Fire',e:'🔥'},{n:'Lightning',e:'⚡'},{n:'Sword',e:'🗡️'}];
const rnd=(a,b)=>a+Math.random()*(b-a);
function spawn(type,x,y,fall){
 const e={type,x:x??rnd(100,700),y:y??rnd(660,850),tx:0,ty:0,act:ACTS[0|rnd(0,4)],actT:rnd(1,4),ph:rnd(0,6),face:1,dead:false,fall:fall||0,busy:false,hop:0};
 pick(e);ents.push(e);return e;}
function pick(e){e.tx=rnd(80,720);e.ty=rnd(650,850);}
function kill(e,cause){e.dead=true;stats[e.type]++;stats[cause]++;}
function fetchW(e,dt){const w=e.fetch,d=Math.hypot(w.x-e.x,w.y-e.y);
 if(d<28){e.weapon=w;e.fetch=null;weapons.splice(weapons.indexOf(w),1);say(e.x,e.y-120,'got '+w.n+'! +60% damage','#ffd24a');e.hop=1;return;}
 const sp=e.type==='croc'?120:210;e.x+=(w.x-e.x)/d*sp*dt;e.y+=(w.y-e.y)/d*sp*dt;e.face=w.x>e.x?1:-1;e.act='dance';}
function drawWeapon(w){
 ctx.textAlign='center';ctx.textBaseline='bottom';
 if(w.y<w.ty){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(w.x,w.y-130);ctx.lineTo(w.x,w.y-70);ctx.stroke();}
 else{ctx.fillStyle='rgba(255,225,80,'+(.25+.15*Math.sin(performance.now()/200))+')';ctx.beginPath();ctx.ellipse(w.x,w.y,46,14,0,0,7);ctx.fill();}
 ctx.font='60px '+EMO;ctx.fillText(w.e,w.x,w.y);
 ctx.font='700 20px '+FONT;ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(w.n,w.x,w.y+24);ctx.fillStyle='#ffe14a';ctx.fillText(w.n,w.x,w.y+24);
 ctx.textBaseline='middle';}
function makeCrack(x,y){const lines=[],n=16;
 for(let i=0;i<n;i++){const a=i/n*6.283+rnd(-.12,.12),L=rnd(300,950),l=[[x,y]];
  for(let k=1;k<=8;k++){const r=L*k/8,aa=a+rnd(-.07,.07),px=x+Math.cos(aa)*r,py=y+Math.sin(aa)*r;l.push([px,py]);
   if(k>2&&Math.random()<.35){const b=aa+rnd(-.9,.9),bl=rnd(40,140);lines.push([[px,py],[px+Math.cos(b)*bl,py+Math.sin(b)*bl]]);}}
  lines.push(l);}
 [70,150,270,420].forEach(r=>{const ring=[];for(let i=0;i<=n;i++){const a=i/n*6.283,rr=r*rnd(.85,1.1);ring.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}lines.push(ring);});
 return{x,y,t:0,lines,em:''};}
function drawCrack(){
 if(!crack)return;const c=crack,al=c.t<12?1:Math.max(0,1-(c.t-12)/3);
 if(c.t<.3){ctx.fillStyle='rgba(255,255,255,'+(.8*(1-c.t/.3))+')';ctx.fillRect(0,0,W,H);}
 ctx.save();ctx.globalAlpha=al;ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,0,W,H);
 if(c.t<2.5){ctx.globalAlpha=al*Math.max(0,1-c.t/2.5);ctx.font='520px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.em,c.x,c.y);ctx.globalAlpha=al;}
 ctx.lineCap='round';ctx.lineJoin='round';
 c.lines.forEach(l=>{ctx.beginPath();l.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle='rgba(20,20,30,.55)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();});
 ctx.restore();ctx.textBaseline='middle';}
function resetGame(){
 ents=[];floats=[];events=[];parts=[];weapons=[];comets=[];
 sceneIdx=0;prevScene=0;sceneT=0;fade=1;banner=3;bannerText='Desert';
 lowT=0;heli=null;cometT=16;weapT=18;throwT=rnd(180,240);toss=null;crack=null;shake=0;
 stats={frog:0,fox:0,croc:0,owl:0,eaten:0,comet:0,thrown:0};
 RULES.forEach(r=>r.t=r.per);
 for(let i=0;i<3;i++){spawn('frog');spawn('fox');spawn('croc');}
 for(let i=0;i<2;i++)spawn('owl');
}
const alive=t=>ents.filter(e=>!e.dead&&!e.fall&&(!t||e.type===t));
const total=()=>ents.filter(e=>!e.dead).length;
function say(x,y,t,c){floats.push({x,y,t,c:c||'#fff',life:1.6});}
function burst(x,y,em){for(let i=0;i<7;i++)parts.push({x,y,vx:rnd(-120,120),vy:rnd(-200,-40),l:1,em});}

/* ---------- backgrounds ---------- */
const trees=[...Array(9)].map((_,i)=>({x:i*100+rnd(-20,20),w:rnd(26,44),h:rnd(300,520)}));
const bld=[];for(let x=-10;x<W;){const w=rnd(70,120),h=rnd(180,460);bld.push({x,w,h,c:rnd(0,3)|0});x+=w+rnd(0,8);}
function drawBg(i){
 const t=performance.now()/1000;
 if(i===0){ // desert
  let g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#f2994a');g.addColorStop(1,'#ffe5a8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(620,230,90,0,7);ctx.fill();
  ctx.fillStyle='#e3a65c';ctx.beginPath();ctx.moveTo(0,620);for(let x=0;x<=W;x+=20)ctx.lineTo(x,470+Math.sin(x*.01)*50+Math.sin(x*.027)*20);ctx.lineTo(W,620);ctx.fill();
  ctx.fillStyle='#2f7d46';[[120,540,1],[390,560,.8],[690,520,1.2]].forEach(([x,y,k])=>{ctx.fillRect(x-9*k,y-90*k,18*k,100*k);ctx.fillRect(x-40*k,y-70*k,14*k,40*k);ctx.fillRect(x-40*k,y-40*k,40*k,12*k);ctx.fillRect(x+26*k,y-60*k,14*k,36*k);ctx.fillRect(x,y-32*k,40*k,12*k);});
  ctx.fillStyle='#d9a05b';ctx.fillRect(0,610,W,H-610);
  ctx.fillStyle='#c98f48';for(let x=0;x<W;x+=70){ctx.beginPath();ctx.ellipse(x+((x*7)%30),700+((x*13)%200),30,6,0,0,7);ctx.fill();}
 }else if(i===1){ // arctic
  let g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#2a4d8f');g.addColorStop(.5,'#8fd3f4');g.addColorStop(1,'#e8f7ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(120,255,200,.25)';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(0,90+k*40);for(let x=0;x<=W;x+=40)ctx.lineTo(x,90+k*40+Math.sin(x*.01+t+k)*30);ctx.lineTo(W,150+k*40);ctx.lineTo(0,150+k*40);ctx.fill();}
  const M=[[100,420],[330,380],[600,440],[780,400]];
  ctx.fillStyle='#cfe9f7';M.forEach(([x,h])=>{ctx.beginPath();ctx.moveTo(x-160,610);ctx.lineTo(x,h);ctx.lineTo(x+160,610);ctx.fill();});
  ctx.fillStyle='#fff';M.forEach(([x,h])=>{ctx.beginPath();ctx.moveTo(x-45,h+55);ctx.lineTo(x,h);ctx.lineTo(x+45,h+55);ctx.fill();});
  ctx.fillStyle='#f1fbff';ctx.fillRect(0,610,W,H-610);
  ctx.fillStyle='#d3ecf9';for(let x=0;x<W;x+=90){ctx.beginPath();ctx.ellipse(x+40,680+((x*11)%220),40,7,0,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.9)';for(let k=0;k<50;k++){ctx.fillRect((k*97+t*20*(1+k%3))%W,(k*61+t*60*(1+k%2))%H,3,3);}
 }else{ // volcano
  let g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#1c0b12');g.addColorStop(1,'#a8321a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2b1a1a';ctx.beginPath();ctx.moveTo(100,610);ctx.lineTo(330,230);ctx.lineTo(470,230);ctx.lineTo(720,610);ctx.fill();
  ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(330,230);ctx.lineTo(470,230);ctx.lineTo(440,300);ctx.lineTo(400,260);ctx.lineTo(360,320);ctx.fill();
  ctx.fillStyle='rgba(255,140,40,'+(.5+.2*Math.sin(t*3))+')';for(let k=0;k<6;k++){ctx.beginPath();ctx.arc(400+Math.sin(t+k*2)*60,220-((t*50+k*60)%180),8+k%3*3,0,7);ctx.fill();}
  ctx.fillStyle='#3a2626';ctx.fillRect(0,610,W,H-610);
  ctx.strokeStyle='#ff6a1a';ctx.lineWidth=5;for(let k=0;k<6;k++){ctx.beginPath();ctx.moveTo(k*150-20,620);ctx.lineTo(k*150+30,720+(k%2)*60);ctx.lineTo(k*150-10,820);ctx.lineTo(k*150+40,H);ctx.stroke();}
 }
}

/* ---------- drawing entities ---------- */
function drawEnt(e,time){
 const S=88,wob=Math.sin(time*6+e.ph);
 ctx.save();ctx.globalAlpha=1;ctx.translate(e.x,e.y);
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,6,36,10,0,0,7);ctx.fill();
 let dy=0,rot=0,dx=0;
 if(e.act==='dance'){dy=-Math.abs(Math.sin(time*7+e.ph))*22;rot=Math.sin(time*7+e.ph)*.35;}
 if(e.act==='box'){dx=Math.sin(time*10+e.ph)*4;}
 if(e.act==='fight'){dx=Math.sin(time*30+e.ph)*6;rot=Math.sin(time*18)*.12;}
 if(e.act==='fish'){dy=wob*2;}
 if(e.hop>0)dy-=Math.sin(Math.min(1,e.hop)*Math.PI)*40;
 ctx.translate(dx,dy);ctx.rotate(rot);
 ctx.font=S+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='bottom';
 ctx.globalAlpha=1;ctx.fillStyle={frog:'#d9f2c4',fox:'#ffcf9e',croc:'#bfe0a0',owl:'#e6d5b8'}[e.type];
 ctx.beginPath();ctx.arc(0,-42,50,0,7);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();
 ctx.save();ctx.scale(e.face,1);ctx.fillText(SP[e.type],0,0);ctx.restore();ctx.globalAlpha=1;
 ctx.font='40px '+EMO;
 if(e.act==='dance'){ctx.fillText('🎵',-44+Math.sin(time*3+e.ph)*8,-70-((time*40+e.ph*20)%30));}
 if(e.act==='box'){const p=Math.sin(time*10+e.ph)*8;ctx.fillText('🥊',-50*1+p,-30);ctx.fillText('🥊',50-p,-30);}
 if(e.act==='fight'&&Math.sin(time*12+e.ph)>0)ctx.fillText('💥',e.face*46,-50);
 if(e.act==='fish'){ctx.fillText('🎣',e.face*52,-44);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(e.face*74,-76);ctx.lineTo(e.face*92,-20+Math.sin(time*3+e.ph)*5);ctx.stroke();ctx.fillText('🐟',e.face*92,-6+Math.sin(time*3+e.ph)*5);}
 if(e.weapon){ctx.font='42px '+EMO;ctx.fillText(e.weapon.e,0,-104);}
 if(e.fall){ctx.font='70px '+EMO;ctx.fillText('🪂',0,-70);}
 ctx.restore();
}

/* ---------- update ---------- */
function startAttack(r){
 const as=alive(r.a).filter(e=>!e.busy),ps=alive(r.p).filter(e=>!e.busy);
 if(!as.length||!ps.length){return;}
 const a=as[0|rnd(0,as.length)],p=ps[0|rnd(0,ps.length)];
 a.busy=p.busy=true;a.act='fight';p.act='fight';
 events.push({a,p,t:0,r});
 say(a.x,a.y-110,SP[r.a]+(a.weapon?a.weapon.e:'')+' → '+SP[r.p],'#ffe14a');
}
function resolve(ev){
 const {a,p,r}=ev;a.busy=p.busy=false;pick(a);pick(p);
 if(p.dead||a.dead)return;
 const s=r.s*(a.weapon?0.4:1);
 if(Math.random()<s){say(p.x,p.y-120,'escaped! ('+Math.round(s*100)+'%)','#7dff9a');p.hop=1;p.act='dance';p.actT=3;}
 else{kill(p,'eaten');say(p.x,p.y-120,'eaten!','#ff6a6a');burst(p.x,p.y-40,'💨');}
}
function startHeli(){
 const miss=Object.keys(SP).filter(t=>!alive(t).length);
 heli={x:W/2,y:-160,t:0,q:miss.flatMap(t=>[t,t]),dropped:0};
 banner=4;bannerText='🚁 Helicopter drop!';
}
let bannerText='Desert';
function update(dt,time){
 // scene change
 sceneT+=dt;
 if(sceneT>=60){sceneT-=60;prevScene=sceneIdx;sceneIdx=(sceneIdx+1)%3;fade=0;banner=3;bannerText=SCENES[sceneIdx];}
 if(fade<1)fade=Math.min(1,fade+dt/1.5);
 if(banner>0)banner-=dt;
 // rule timers
 RULES.forEach(r=>{r.t-=dt;if(r.t<=0){r.t+=r.per;startAttack(r);}});
 // screen toss
 throwT-=dt;
 if(throwT<=0){throwT=rnd(180,240);const a=alive().filter(e=>!e.busy);
  if(a.length&&!toss){const t=a[0|rnd(0,a.length)];t.busy=true;toss={e:t,t:0,ix:W/2+rnd(-80,80),iy:H*.45+rnd(-80,80)};say(t.x,t.y-130,'thrown at the screen!','#ffffff');}}
 if(toss){toss.t+=dt;
  if(toss.t>=2.2){const e=toss.e;if(!e.dead)kill(e,'thrown');crack=makeCrack(toss.ix,toss.iy);crack.em=SP[e.type];shake=.9;toss=null;}}
 if(crack){crack.t+=dt;if(crack.t>15)crack=null;}
 shake=Math.max(0,shake-dt*1.2);
 // comet
 cometT-=dt;
 if(cometT<=0){cometT+=16;const a=alive();if(a.length){const t=a[0|rnd(0,a.length)];comets.push({sx:t.x+280,sy:-140,tx:t.x,ty:t.y-40,t:0,target:t});say(t.x,t.y-130,'☄️ incoming!','#ffb347');}}
 comets=comets.filter(c=>{c.t+=dt;
  if(c.target.dead){const a=alive();if(a.length)c.target=a[0|rnd(0,a.length)];}
  c.tx=c.target.x;c.ty=c.target.y-40;
  if(c.t>=1.3){if(!c.target.dead){kill(c.target,'comet');say(c.tx,c.ty-60,'comet strike!','#ff8a3a');burst(c.tx,c.ty,'🔥');burst(c.tx,c.ty,'💥');}return false;}
  return true;});
 // weapons
 weapT-=dt;
 if(weapT<=0){weapT+=18;const w=WEAPONS[0|rnd(0,WEAPONS.length)];weapons.push({n:w.n,e:w.e,x:rnd(100,700),y:-60,ty:rnd(680,850),claimer:null});if(weapons.length>3)weapons.shift();banner=3;bannerText=w.e+' '+w.n+' dropped';}
 weapons.forEach(w=>{
  if(w.y<w.ty){w.y=Math.min(w.ty,w.y+520*dt);return;}
  if(!w.claimer||w.claimer.dead||w.claimer.weapon){
   const c=alive().filter(e=>!e.weapon&&!e.busy).sort((a,b)=>Math.hypot(a.x-w.x,a.y-w.y)-Math.hypot(b.x-w.x,b.y-w.y))[0];
   w.claimer=c||null;if(c)c.fetch=w;}});
 // entities
 ents.forEach(e=>{
  if(e.dead)return;
  if(e.fall){e.y+=190*dt;if(e.y>=e.fall){e.y=e.fall;e.fall=0;burst(e.x,e.y-30,'🍃');}return;}
  if(e.hop>0)e.hop-=dt*1.4;
  if(!e.busy&&e.fetch&&weapons.includes(e.fetch)&&e.fetch.y>=e.fetch.ty){fetchW(e,dt);}
  else if(!e.busy){
   e.actT-=dt;if(e.actT<=0){e.act=ACTS[0|rnd(0,4)];e.actT=rnd(2,5);if(Math.random()<.5)pick(e);}
   if(e.act==='dance'||e.act==='box'){const d=Math.hypot(e.tx-e.x,e.ty-e.y);
    if(d>6){const sp=e.type==='croc'?28:55;e.x+=(e.tx-e.x)/d*sp*dt;e.y+=(e.ty-e.y)/d*sp*dt;e.face=e.tx>e.x?1:-1;}}
  }
 });
 // spread out
 const L=ents.filter(e=>!e.dead&&!e.fall);
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];
  const duel=events.some(v=>(v.a===a&&v.p===b)||(v.a===b&&v.p===a));
  const min=duel?72:104;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d<min){if(d<1){dx=rnd(-1,1);dy=rnd(-1,1);d=Math.hypot(dx,dy)||1;}
   const push=(min-d)*6*dt,ux=dx/d,uy=dy/d;a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;}}
 L.forEach(e=>{e.x=Math.max(50,Math.min(750,e.x));e.y=Math.max(640,Math.min(860,e.y));});
 // attacks
 events=events.filter(ev=>{
  ev.t+=dt;const {a,p}=ev;
  if(a.dead||p.dead){a.busy=p.busy=false;return false;}
  const k=Math.min(1,ev.t/1.1),d=Math.hypot(p.x-a.x,p.y-a.y);
  if(d>72){a.x+=(p.x-a.x)/d*330*dt;a.y+=(p.y-a.y)/d*330*dt;}
  a.face=p.x>a.x?1:-1;p.face=-a.face;
  if(ev.t>=1.6){resolve(ev);return false;}
  return true;
 });
 ents=ents.filter(e=>!e.dead);
 // helicopter
 if(!heli){
  if(total()<=2)lowT+=dt;else lowT=0;
  if(lowT>=20){lowT=0;startHeli();}
 }else{
  heli.t+=dt;
  const targetY=heli.t<2?-160+(heli.t/2)*300:(heli.t<2+heli.q.length*.6+.5?140:140-(heli.t-(2+heli.q.length*.6+.5))*160);
  heli.y=targetY;heli.x=W/2+Math.sin(heli.t*1.5)*130;
  while(heli.t>2&&heli.dropped<heli.q.length&&heli.t>2+heli.dropped*.6){
   spawn(heli.q[heli.dropped],heli.x+rnd(-20,20),heli.y+40,rnd(680,850));heli.dropped++;}
  if(heli.y<-170&&heli.dropped>=heli.q.length)heli=null;
 }
 floats.forEach(f=>{f.life-=dt;f.y-=28*dt;});floats=floats.filter(f=>f.life>0);
 parts.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;});parts=parts.filter(p=>p.l>0);
}

/* ---------- HUD ---------- */
function pill(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();}
function hud(){
 ctx.textBaseline='middle';
 // counts
 pill(16,16,W-32,64,'rgba(10,20,15,.62)');
 ctx.textAlign='left';
 Object.keys(SP).forEach((t,i)=>{
  ctx.font='36px '+EMO;ctx.fillText(SP[t],34+i*118,49);
  ctx.font='700 32px '+FONT;ctx.fillStyle='#fff';ctx.fillText('×'+alive(t).length,80+i*118,50);});
 ctx.textAlign='right';ctx.font='500 24px '+FONT;ctx.fillStyle='#cfe8d6';
 ctx.fillText(SCENES[sceneIdx]+' · '+Math.ceil(60-sceneT)+'s',W-34,49);
 // timers
 const y=H-70;pill(16,y-6,W-32,64,'rgba(10,20,15,.62)');
 ctx.textAlign='center';
 RULES.forEach((r,i)=>{const cx=16+(W-32)/10*(2*i+1);
  ctx.font='26px '+EMO;ctx.fillText(SP[r.a]+'→'+SP[r.p],cx,y+14);
  ctx.font='500 18px '+FONT;ctx.fillStyle='#ffe9a8';ctx.fillText(Math.ceil(r.t)+'s · prey '+Math.round(r.s*100)+'%',cx,y+42);});
 // death statistics
 pill(16,88,W-32,44,'rgba(60,12,12,.65)');
 ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='26px '+EMO;ctx.fillText('☠️',30,111);
 Object.keys(SP).forEach((t,i)=>{ctx.font='26px '+EMO;ctx.fillStyle='#fff';ctx.fillText(SP[t],74+i*100,111);ctx.font='700 24px '+FONT;ctx.fillText(stats[t],110+i*100,112);});
 ctx.textAlign='right';ctx.font='500 18px '+FONT;ctx.fillStyle='#ffc9c9';
 ctx.fillText('eaten '+stats.eaten+' \u00b7 comet '+stats.comet+' \u00b7 thrown '+stats.thrown+' \u00b7 total '+(stats.eaten+stats.comet+stats.thrown),W-30,111);
 // comet + weapon timers
 pill(16,H-130,W-32,44,'rgba(10,20,15,.62)');
 ctx.textAlign='center';ctx.fillStyle='#fff';
 [['☄️','comet '+Math.ceil(cometT)+'s'],['🗡️','weapon '+Math.ceil(weapT)+'s'],['💫','screen toss '+Math.ceil(throwT)+'s']].forEach(([em,tx],i)=>{const cx=W*(2*i+1)/6;
  ctx.font='24px '+EMO;ctx.fillText(em,cx-78,H-107);ctx.font='500 21px '+FONT;ctx.fillStyle='#ffe9a8';ctx.fillText(tx,cx+14,H-107);ctx.fillStyle='#fff';});
 // reset button
 pill(664,150,120,44,'#ffe14a');ctx.font='700 22px '+FONT;ctx.fillStyle='#1b2a1b';ctx.fillText('↻ Reset',724,173);
 // low pop warning
 const n=total();
 if(!heli&&n<=2){pill(W/2-230,150,460,44,'rgba(190,40,40,.85)');ctx.font='700 24px '+FONT;ctx.fillStyle='#fff';
  ctx.fillText('Only '+n+' left · helicopter in '+Math.ceil(20-lowT)+'s',W/2,173);}
 // banner
 if(banner>0){ctx.globalAlpha=Math.min(1,banner);ctx.font='700 64px '+FONT;ctx.textAlign='center';
  ctx.lineWidth=10;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(bannerText,W/2,300);ctx.fillStyle='#fff';ctx.fillText(bannerText,W/2,300);ctx.globalAlpha=1;}
}

/* ---------- loop ---------- */
cv.addEventListener('pointerdown',ev=>{const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
 if(x>=654&&x<=794&&y>=140&&y<=204)resetGame();});
addEventListener('keydown',ev=>{if(ev.key==='r'||ev.key==='R')resetGame();});
resetGame();
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
 ctx.globalAlpha=1;update(dt,time);ctx.save();if(shake>0)ctx.translate(rnd(-1,1)*shake*16,rnd(-1,1)*shake*16);
 if(fade<1){drawBg(prevScene);ctx.globalAlpha=fade;drawBg(sceneIdx);ctx.globalAlpha=1;}else drawBg(sceneIdx);
 ents.filter(e=>!(toss&&toss.e===e)).sort((a,b)=>a.y-b.y).forEach(e=>drawEnt(e,time));
 weapons.forEach(drawWeapon);
 if(toss){const k=Math.min(1,toss.t/2.2),e=toss.e,sy=e.y-40,x=e.x+(toss.ix-e.x)*k,y=sy+(toss.iy-sy)*k-Math.sin(k*Math.PI)*120;
  ctx.save();ctx.translate(x,y);ctx.rotate(k*12);ctx.font=(88*(1+k*k*4.9))+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SP[e.type],0,0);ctx.restore();}
 comets.forEach(c=>{const k=c.t/1.3,x=c.sx+(c.tx-c.sx)*k,y=c.sy+(c.ty-c.sy)*k;
  ctx.strokeStyle='rgba(255,170,60,.7)';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(c.sx-c.tx)*.25,y+(c.sy-c.ty)*.25);ctx.stroke();ctx.lineCap='butt';
  ctx.font='110px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('☄️',x,y);});
 ctx.textAlign='center';ctx.textBaseline='middle';
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.font='30px '+EMO;ctx.fillText(p.em,p.x,p.y);});ctx.globalAlpha=1;
 if(heli){ctx.font='130px '+EMO;ctx.fillText('🚁',heli.x,heli.y);}
 floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life);ctx.font='700 30px '+FONT;ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.6)';
  ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);});ctx.globalAlpha=1;
 hud();drawCrack();ctx.restore();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
